- title: EARSHOT
  subtitle: A minimal neural network model of human speech recognition
  group: featured
  image: images/earshot_model.png
  link: https://github.com/maglab-uconn/EARSHOT
  description: A model of human speech recognition that learns to map real speech to semantic patterns without explicit phonetic training. See Magnuson et al. (2020), *Cognitive Science*, [doi:10.1111/cogs.12823](https://doi.org/10.1111/cogs.12823).
  repo: maglab-uconn/EARSHOT
  tags:
    - software
    - model

- title: jTRACE
  subtitle: A reimplementation and extension of the TRACE model
  group: featured
  image: resources/jtrace/jtrace-screen.jpg
  link: resources/jtrace/
  description: A cross-platform reimplementation of the TRACE model of speech perception and spoken word recognition, with a graphical user interface and tools for batch processing, scripting, graphing, and visualization.
  tags:
    - software
    - model

- title: LexFindR
  subtitle: An R package for finding similar words in a lexicon
  group: featured
  image: images/photo.jpg
  link: https://github.com/maglab-uconn/LexFindR
  description: A fast, simple, and extensible R package for finding phonological competitors and other similar words in a lexicon. See Li, Crinnion, & Magnuson (2021), *Behavior Research Methods*, [doi:10.3758/s13428-021-01667-6](https://doi.org/10.3758/s13428-021-01667-6).
  repo: maglab-uconn/LexFindR
  tags:
    - software

